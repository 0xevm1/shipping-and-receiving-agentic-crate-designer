# CI for every pull request to main and every push to main (#32).
#
# A green run is a precondition for merging. GitHub can't enforce it on this private repo
# without GitHub Pro (the branch protection and rulesets APIs return 403). If the repo is
# upgraded or made public, require the `checks` and `e2e` jobs on main with:
#
#   gh api --method POST repos/0xevm1/shipping-ui/rulesets --input - <<'EOF'
#   {
#     "name": "main: require CI",
#     "target": "branch",
#     "enforcement": "active",
#     "conditions": { "ref_name": { "include": ["~DEFAULT_BRANCH"], "exclude": [] } },
#     "rules": [
#       {
#         "type": "required_status_checks",
#         "parameters": {
#           "strict_required_status_checks_policy": false,
#           "required_status_checks": [{ "context": "checks" }, { "context": "e2e" }]
#         }
#       }
#     ]
#   }
#   EOF
#
# When you add a job under `jobs:`, list its name in `required_status_checks` above.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Next.js runs on Node; match the version the README is verified on.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Bun version comes from `packageManager` in package.json (bun@1.3.5).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # `prepare` installs the local pre-commit hook (#31); CI doesn't commit, so skip it.
      - name: Install
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

      - name: Lint
        run: bun run lint

      # `next typegen` (route types such as LayoutProps), then `tsc --noEmit`.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Playwright end-to-end UI tests (#34). Runs alongside `checks`; both must pass.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # On a cache hit the browser is restored; its system libraries are installed either way.
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # Production build with the read-only test hook (window.__crate) compiled in.
      - name: Build (e2e)
        run: bun run build
        env:
          NEXT_PUBLIC_E2E: "1"

      - name: E2E tests
        run: bun run e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
