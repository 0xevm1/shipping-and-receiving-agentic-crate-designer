# CI for every pull request to main and every push to main (#32).
#
# A green run is a precondition for merging. GitHub can't enforce it on this private repo
# without GitHub Pro (the branch protection and rulesets APIs return 403). If the repo is
# upgraded or made public, require the `checks` job on main with:
#
#   gh api --method POST repos/0xevm1/shipping-ui/rulesets --input - <<'EOF'
#   {
#     "name": "main: require CI",
#     "target": "branch",
#     "enforcement": "active",
#     "conditions": { "ref_name": { "include": ["~DEFAULT_BRANCH"], "exclude": [] } },
#     "rules": [
#       {
#         "type": "required_status_checks",
#         "parameters": {
#           "strict_required_status_checks_policy": false,
#           "required_status_checks": [{ "context": "checks" }]
#         }
#       }
#     ]
#   }
#   EOF
#
# Add more jobs (e.g. the Playwright e2e job, #34) under `jobs:` and list each job's name in
# `required_status_checks` above.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Next.js runs on Node; match the version the README is verified on.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Bun version comes from `packageManager` in package.json (bun@1.3.5).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Next generates the route types (LayoutProps, etc.) that tsc needs.
      - name: Typecheck
        run: bunx next typegen && bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
