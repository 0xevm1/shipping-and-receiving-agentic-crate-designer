# CI for every pull request to main and every push to main: lint, typecheck, unit tests and
# build (`checks`), and the Postgres integration tests (`integration`, #46). The Playwright suite
# is not part of it; it runs on demand from `e2e.yml`.
#
# A green run is a precondition for merging. GitHub can't enforce it on this private repo
# without GitHub Pro (the branch protection and rulesets APIs return 403). If the repo is
# upgraded or made public, require the `checks` and `integration` jobs on main with:
#
#   gh api --method POST repos/0xevm1/shipping-ui/rulesets --input - <<'EOF'
#   {
#     "name": "main: require CI",
#     "target": "branch",
#     "enforcement": "active",
#     "conditions": { "ref_name": { "include": ["~DEFAULT_BRANCH"], "exclude": [] } },
#     "rules": [
#       {
#         "type": "required_status_checks",
#         "parameters": {
#           "strict_required_status_checks_policy": false,
#           "required_status_checks": [{ "context": "checks" }, { "context": "integration" }]
#         }
#       }
#     ]
#   }
#   EOF
#
# When you add a job under `jobs:`, list its name in `required_status_checks` above.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Next.js runs on Node; match the version the README is verified on.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Bun version comes from `packageManager` in package.json (bun@1.3.5).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # `prepare` installs the local pre-commit hook (#31); CI doesn't commit, so skip it.
      - name: Install
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

      # Prettier (.prettierrc); `bun run format` fixes it.
      - name: Format
        run: bun run format:check

      # docker-compose.yml parses and every image is pinned (#46). No containers start here.
      - name: Compose config
        run: docker compose config --quiet

      - name: Lint
        run: bun run lint

      # `next typegen` (route types such as LayoutProps), then `tsc --noEmit`.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Postgres integration tests (#46). Starts Postgres and the blob emulator from the same
  # docker-compose.yml developers use (not a `services:` block), so CI and local can't drift.
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

      # A schema change without its migration fails here: `db:generate` must write nothing.
      - name: Migrations match the schema
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            git status --porcelain -- db/migrations
            echo "::error::src/server/db/schema.ts changed without a migration. Run 'bun run db:generate' and commit db/migrations."
            exit 1
          fi
          bunx drizzle-kit check

      # Postgres and the blob emulator healthy, buckets and CORS set up.
      - name: Start infrastructure
        run: bun run infra:up

      - name: Migrate an empty database
        run: bun run db:migrate

      - name: Integration tests
        run: bun run test:integration

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
